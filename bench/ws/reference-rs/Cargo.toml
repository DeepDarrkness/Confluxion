[package]
name = "ws-reference"
version = "0.1.0"
edition = "2021"

[dependencies]
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
serde_json = "=1.0.145"
libc = "=0.2.177"

[dev-dependencies]
confluxion-ws-native = { path = "../../../src/ws/native" }
rand = "=0.9.5"
rand_chacha = "=0.9.0"

[[bin]]
name = "ws-reference"
path = "src/main.rs"
test = false

[[test]]
name = "phase1"
path = "../../../tests/ws/phase1.rs"

[[test]]
name = "phase0"
path = "../../../tests/ws/phase0.rs"

[[test]]
name = "phase2"
path = "../../../tests/ws/phase2.rs"
