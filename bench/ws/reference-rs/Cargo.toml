[package]
name = "ws-reference"
version = "0.1.0"
edition = "2021"

[dependencies]
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
serde_json = "=1.0.145"
libc = "=0.2.177"

confluxion-ws-native = { path = "../../../src/ws/native", optional = true }
rand = { version = "=0.9.5", optional = true }
rand_chacha = { version = "=0.9.0", optional = true }

[features]
default = ["phase5"]
phase0 = []
phase1 = ["dep:confluxion-ws-native"]
phase2 = ["dep:confluxion-ws-native", "dep:rand", "dep:rand_chacha"]
phase3 = ["dep:confluxion-ws-native"]
phase4 = ["dep:confluxion-ws-native"]
phase5 = ["dep:confluxion-ws-native"]

[[bin]]
name = "ws-reference"
path = "src/main.rs"
test = false

[[test]]
name = "phase1"
path = "../../../tests/ws/phase1.rs"
required-features = ["phase1"]

[[test]]
name = "phase0"
path = "../../../tests/ws/phase0.rs"
required-features = ["phase0"]

[[test]]
name = "phase2"
path = "../../../tests/ws/phase2.rs"
required-features = ["phase2"]

[[test]]
name = "phase3"
path = "../../../tests/ws/phase3.rs"
required-features = ["phase3"]

[[test]]
name = "phase4"
path = "../../../tests/ws/phase4.rs"
required-features = ["phase4"]

[[test]]
name = "phase5"
path = "../../../tests/ws/phase5.rs"
required-features = ["phase5"]
